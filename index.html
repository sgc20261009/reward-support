<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>感谢支持 · 打赏</title>
<style>
  :root {
    --wx: #07c160;
    --ali: #1677ff;
    --gold: #f5b942;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #2b2118 0%, #16110c 55%, #0d0a07 100%);
    color: #f4ece0;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 1px solid rgba(245,185,66,.25);
    border-radius: 22px;
    padding: 36px 28px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    text-align: center;
  }
  .heart {
    font-size: 40px;
    filter: drop-shadow(0 4px 10px rgba(245,185,66,.5));
    animation: beat 1.6s ease-in-out infinite;
  }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  h1 {
    font-size: 26px;
    margin: 10px 0 6px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #f5b942, #ffd98a, #f5b942);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    font-size: 14px;
    color: #c9bda9;
    margin-bottom: 22px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .qr {
    background: #fff;
    border-radius: 18px;
    padding: 16px 16px 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .qr .label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 15px;
    color: #1c1c1c;
    margin-bottom: 10px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .wx .dot { background: var(--wx); }
  .ali .dot { background: var(--ali); }
  .qr img { width: 100%; max-width: 240px; height: auto; border-radius: 8px; display: block; margin: 0 auto; }
  .payee {
    margin-top: 8px;
    font-size: 13px;
    color: #555;
  }
  .amounts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 26px 0 6px;
  }
  .chip {
    border: 1px solid rgba(245,185,66,.4);
    background: rgba(245,185,66,.08);
    color: #ffd98a;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
  }
  .tip {
    font-size: 12.5px;
    color: #9b8f7c;
    margin-top: 8px;
    line-height: 1.7;
  }
  .footer {
    margin-top: 22px;
    font-size: 12px;
    color: #6f6555;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
    .card { padding: 28px 18px 24px; }
  }
</style>
</head>
